<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3246E6">
<title>Кадр</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Кадр">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-width column, sticky top bar, card feed, fixed tab bar */
:root{
  --bg:#EEF0F6; --surface:#FFFFFF; --fg:#151826; --muted:#69708A; --line:#E1E4EE; --soft:#F3F4F9;
  --accent:#3246E6; --accent2:#F0A33A; --heart:#E5334B; --ok:#1F9D66; --overlay:rgba(12,14,24,.55);
  --font-d:'Unbounded','Manrope',system-ui,sans-serif;
  --font-b:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0D14; --surface:#131623; --fg:#EDEFF7; --muted:#8C93AD; --line:#252A3C; --soft:#1B1F2F;
  --accent:#6E7DFF; --accent2:#F5B354; --heart:#FF5468; --ok:#3CCB8B; --overlay:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0D14; --surface:#131623; --fg:#EDEFF7; --muted:#8C93AD; --line:#252A3C; --soft:#1B1F2F;
  --accent:#6E7DFF; --accent2:#F5B354; --heart:#FF5468; --ok:#3CCB8B; --overlay:rgba(0,0,0,.7); color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.45}
img{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
input,textarea{font:inherit;color:var(--fg)}
svg{display:block}
a{color:inherit}
.app{max-width:500px;margin:0 auto;min-height:100%;background:var(--surface);padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));border-inline:1px solid var(--line)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;min-height:60px}
.logo{font-family:var(--font-d);font-weight:700;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 200deg,var(--accent),var(--accent2),var(--heart),var(--accent));position:relative}
.logo i::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.top h1{font-family:var(--font-d);font-size:17px;font-weight:500;margin:0;display:flex;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;flex:0 0 auto}
.ibtn:hover{background:var(--soft)}
.ibtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;align-items:center;gap:4px}

/* posts */
.feed{display:flex;flex-direction:column;gap:28px;padding-block:18px 28px}
.post{display:flex;flex-direction:column;gap:10px}
.ph-head{display:flex;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:10px;text-align:left;min-width:0}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--soft)}
.who b{font-weight:700;font-size:14px;display:flex;align-items:center}
.who small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-head .when{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.photo{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/5;max-width:100%;background:var(--soft);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.photo img,.photo video{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none}
.textcard{border-radius:var(--r);padding:28px 22px;background:linear-gradient(135deg,var(--accent),#7B4BE0 60%,var(--heart));color:#fff;font-family:var(--font-d);font-weight:500;font-size:19px;line-height:1.35;white-space:pre-line;overflow-wrap:anywhere;position:relative;user-select:none;-webkit-user-select:none}
.textcard .tag,.textcard .ment{color:#fff;text-decoration:underline}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
.burst svg{width:96px;height:96px;fill:#fff;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.burst.on{animation:pop .8s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.1)}40%{transform:scale(.95)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
.acts{display:flex;align-items:center;gap:4px;margin-left:-8px}
.acts .sp{flex:1}
.acts button{width:40px;height:40px;display:grid;place-items:center;border-radius:12px}
.acts button:hover{background:var(--soft)}
.acts svg{width:25px;height:25px;fill:none;stroke:var(--fg);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.like[aria-pressed="true"] svg{fill:var(--heart);stroke:var(--heart);animation:beat .35s ease}
.save[aria-pressed="true"] svg{fill:var(--fg)}
@keyframes beat{50%{transform:scale(1.25)}}
.likes{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.cap{margin:0;font-size:14px;overflow-wrap:anywhere;white-space:pre-line}
.cap b{font-weight:700;margin-right:6px;cursor:pointer}
.tag,.ment{color:var(--accent);cursor:pointer;font-weight:600;text-decoration:none}
.morec{color:var(--muted);font-size:14px;text-align:left}
.c1{margin:0;font-size:14px;overflow-wrap:anywhere}
.c1 b{font-weight:700;margin-right:6px}

/* verified */
.vb{display:inline-block;vertical-align:-3px;margin-left:4px;width:15px;height:15px;flex:0 0 auto}
.vb path{fill:var(--accent)}.vb polyline{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.big-vb .vb{width:19px;height:19px}

.bdg{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px;margin:6px 6px 0 0}
.bdg.ambassador{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.reasons{display:flex;flex-direction:column;gap:8px}
.reasons label{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;font-weight:600;cursor:pointer}
.reasons input{accent-color:var(--accent);width:18px;height:18px}
.rep{display:flex;flex-direction:column;gap:10px;padding-block:14px;border-bottom:1px solid var(--line)}
.rep .top2{display:flex;gap:12px;align-items:flex-start}
.rep .thumb{width:72px;height:90px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:var(--soft)}
.rep .thumbtx{width:72px;height:90px;border-radius:10px;flex:0 0 auto;background:linear-gradient(135deg,var(--accent),#7B4BE0 60%,var(--heart));color:#fff;font-size:10px;padding:6px;overflow:hidden}
.rep ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.invbar{height:8px;border-radius:4px;background:var(--surface);overflow:hidden;border:1px solid var(--line)}
.invbar b{display:block;height:100%;background:var(--accent)}
.offl{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:1px 5px;margin-left:6px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:500px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{height:60px;display:grid;place-items:center;color:var(--muted);position:relative}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg{stroke-width:2.6}
.tab.new span{width:44px;height:34px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:#fff}
.tab.new svg{stroke:#fff;width:22px;height:22px;stroke-width:2.4}
.tab .meav{width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid transparent}
.tab[aria-current="page"] .meav{border-color:var(--fg)}
.dot{position:absolute;top:12px;left:calc(50% + 9px);min-width:16px;height:16px;border-radius:8px;background:var(--heart);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}

/* explore / grids */
.search{position:relative;padding-block:12px}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--soft);padding:0 14px 0 40px;outline:none}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.chip .n{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--heart);color:#fff;font-size:11px;margin-left:6px;padding:0 4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.grid>button{position:relative;aspect-ratio:1;overflow:hidden;background:var(--soft)}
.grid.r9>button{aspect-ratio:9/16}
.grid img,.grid video{width:100%;height:100%;object-fit:cover;display:block}
.grid .tx{position:absolute;inset:0;padding:10px;background:linear-gradient(135deg,var(--accent),#7B4BE0 60%,var(--heart));color:#fff;font-size:12px;font-weight:700;text-align:left;overflow:hidden;line-height:1.3}
.grid .cnt{position:absolute;inset:auto 6px 6px auto;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);display:flex;gap:4px;align-items:center}
.grid .cnt svg{width:13px;height:13px;fill:#fff}
.ulist{display:flex;flex-direction:column;gap:12px;padding-bottom:16px}
.urow{display:flex;align-items:center;gap:12px;text-align:left;min-width:0}
.urow .av{width:44px;height:44px}
.urow b{display:flex;align-items:center;font-size:14px}.urow small{color:var(--muted);font-size:13px;display:block}
.empty{color:var(--muted);text-align:center;padding:40px 16px;font-size:14px}
.empty strong{display:block;color:var(--fg);font-family:var(--font-d);font-weight:500;font-size:17px;margin-bottom:6px}
.sugg{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.sugg::-webkit-scrollbar{display:none}
.scard{flex:0 0 140px;border:1px solid var(--line);border-radius:var(--r);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.scard .av{width:60px;height:60px}
.scard b{font-size:13px;display:flex;align-items:center;max-width:100%;overflow:hidden}
.scard small{color:var(--muted);font-size:12px}
.sec-h{margin:0;font-family:var(--font-d);font-weight:500;font-size:16px}

/* profile */
.prof{padding-block:20px 16px;display:flex;flex-direction:column;gap:14px}
.prow{display:flex;align-items:center;gap:22px}
.prow .big{width:88px;height:88px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);flex:1;text-align:center}
.stats b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.pname{font-weight:800;font-size:15px}
.pbio{margin:2px 0 0;font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-height:38px;border-radius:11px;background:var(--soft);font-weight:700;font-size:14px;border:1px solid var(--line);padding:0 12px;position:relative;white-space:nowrap}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--heart)}
.btn.sm{flex:0 0 auto;min-height:32px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.btn .n{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--heart);color:#fff;font-size:11px;margin-left:6px;padding:0 4px}
.ptabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--line)}
.ptabs button{height:46px;display:grid;place-items:center;color:var(--muted);border-top:2px solid transparent;margin-top:-1px}
.ptabs button[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.ptabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9}
.form{display:flex;flex-direction:column;gap:12px}
.form label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;display:flex;flex-direction:column;gap:6px}
.form input,.form textarea{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:11px 12px;outline:none;text-transform:none;letter-spacing:0;font-weight:500;color:var(--fg);font-size:16px;resize:vertical}
.err{color:var(--heart);font-size:14px;font-weight:600;margin:0}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.card h3{margin:0;font-family:var(--font-d);font-weight:500;font-size:15px;display:flex;align-items:center;gap:6px}
.card p{margin:0;font-size:13px;color:var(--muted)}

/* auth */
.auth{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:40px;max-width:420px;margin:0 auto}
.auth .logo{font-size:34px;justify-content:center}
.auth .logo i{width:32px;height:32px;border-radius:10px}
.auth .logo i::after{inset:9px}
.auth .lead{text-align:center;color:var(--muted);margin:0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;border:1px solid var(--line)}
.seg button{height:38px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* create */
.create{display:flex;flex-direction:column;gap:16px;padding-block:16px 24px}
.drop{border:2px dashed var(--line);border-radius:var(--r);aspect-ratio:4/5;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--soft)}
.drop svg{width:56px;height:56px;stroke:var(--muted);fill:none;stroke-width:1.4}
.drop strong{font-family:var(--font-d);font-weight:500;color:var(--fg);font-size:18px}
.drop .btns{width:100%;max-width:340px}
.filters{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.flt{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.flt img{width:70px;height:70px;object-fit:cover;border-radius:12px;border:2px solid transparent}
.flt[aria-pressed="true"]{color:var(--fg)}
.flt[aria-pressed="true"] img{border-color:var(--accent)}
.prog{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.prog b{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

/* chat (support) */
.tlist{display:flex;flex-direction:column}
.trow{display:flex;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.trow .av{width:42px;height:42px}
.trow .m{flex:1;min-width:0}
.trow b{display:flex;align-items:center;gap:6px;font-size:14px;overflow:hidden;white-space:nowrap}
.trow small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow time{font-size:12px;color:var(--muted);white-space:nowrap}
.trow.unread b::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.st{font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;white-space:nowrap}
.st.open{background:color-mix(in srgb,var(--accent2) 22%,transparent);color:color-mix(in srgb,var(--accent2) 60%,var(--fg))}
.st.answered{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.st.closed{background:var(--soft);color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:8px;padding-block:16px 120px}
.msg{max-width:82%;padding:9px 12px;border-radius:16px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4}
.msg small{display:block;font-size:11px;opacity:.7;margin-top:3px;text-align:right}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:var(--soft);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg .by{font-size:12px;font-weight:800;display:flex;align-items:center;margin-bottom:2px;color:var(--accent)}
.daysep{align-self:center;font-size:12px;color:var(--muted);padding:4px 0}
.composer{position:fixed;left:0;right:0;bottom:calc(61px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--surface);border-top:1px solid var(--line)}
.composer form{max-width:500px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;padding-block:10px}
.composer textarea{flex:1;min-width:0;min-height:42px;max-height:140px;border-radius:21px;border:1px solid var(--line);background:var(--soft);padding:10px 16px;outline:none;resize:none;font-size:16px}
.composer .send{width:42px;height:42px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.composer .send svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.composer .send:disabled{opacity:.4}
.composer .extra{display:flex;gap:8px;padding-top:8px;flex-wrap:wrap}

/* admin */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.urow2{display:flex;flex-direction:column;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
.urow2 .btns{gap:6px}
.pill{font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;background:var(--soft);color:var(--muted);margin-left:6px}
.pill.red{background:color-mix(in srgb,var(--heart) 15%,transparent);color:var(--heart)}
.pill.blue{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.secret{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px;user-select:all;word-break:break-all}

/* overlays */
.ov{position:fixed;inset:0;z-index:20;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}

/* ---------- api ---------- */
async function api(path,opt={}){
  const init={method:opt.method||(opt.body?'POST':'GET'),credentials:'same-origin',headers:{}};
  if(opt.body){init.headers['Content-Type']='application/json';init.body=JSON.stringify(opt.body);}
  let r;try{r=await fetch('api/'+path,init);}catch(e){throw new Error('Нет связи с сервером. Проверьте интернет');}
  let d={};try{d=await r.json();}catch(e){}
  if(r.status===401&&!opt.auth){ME=null;showAuth();throw new Error(d.error||'Войдите в аккаунт');}
  if(!r.ok)throw new Error(d.error||('Ошибка '+r.status));
  return d;
}
function upload(blob,type,onProgress){
  return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('POST','api/upload');x.setRequestHeader('Content-Type',type);
    x.upload.onprogress=e=>e.lengthComputable&&onProgress&&onProgress(e.loaded/e.total);
    x.onload=()=>{let d={};try{d=JSON.parse(x.responseText);}catch(e){}x.status<300?res(d):rej(new Error(d.error||'Не удалось загрузить файл'));};
    x.onerror=()=>rej(new Error('Нет связи с сервером'));x.send(blob);});
}

const loading=()=>`<div class="loading">Загружаем…</div>`;
const errBox=m=>`<div class="empty gut"><strong>Не получилось загрузить</strong>${esc(m)}<div class="btns" style="justify-content:center;margin-top:14px"><button class="btn sm" data-act="reload">Повторить</button></div></div>`;
function themeBtn(){return `<button class="ibtn" data-act="theme" aria-label="Сменить тему">${I.moon}</button>`}

let renderSeq=0;
async function render(keepScroll){
  if(!ME)return showAuth();
  const seq=++renderSeq;const y=window.scrollY;stopReels();tabsHTML();
  const app=$('#app');
  const view=S.sub==='activity'?activityView:S.sub==='support'?supportView:S.sub==='ticket'?ticketView:S.sub==='admin'?adminView:S.sub==='aticket'?adminTicketView:S.sub==='settings'?settingsView:
    S.user?()=>profileView(S.user):S.tab==='feed'?feedView:S.tab==='explore'?exploreView:S.tab==='new'?createView:S.tab==='reels'?reelsView:()=>profileView(ME.handle);
  const sync=view.sync;
  if(!sync&&!keepScroll)app.innerHTML=loading();
  let html;try{html=await view();}catch(e){html=topBar(`${backBtn('home')}<h1>Кадр</h1><span style="width:40px"></span>`)+errBox(e.message);}
  if(seq!==renderSeq)return;
  app.innerHTML=html;
  window.scrollTo(0,keepScroll?y:0);
  bindView();
  if(S.tab==='reels'&&!S.user&&!S.sub)startReels();
}

async function profileView(h){
  const d=await api('users/'+encodeURIComponent(h));const u=d.user;keep(d.posts);
  const me=u.isMe;if(me){try{ME=(await api('me')).me;}catch(e){}}
  const head=me?`<h1 class="big-vb">${hnd(u)}</h1><div class="row">${themeBtn()}<button class="ibtn" data-act="sub" data-sub="settings" aria-label="Настройки">${I.gear}</button></div>`:`${backBtn()}<h1 class="big-vb">${hnd(u)}</h1><span style="width:40px"></span>`;
  let body=`<div class="prow"><img class="big" src="${avOf(u)}" alt="">
      <div class="stats"><div><b>${num(u.posts)}</b><span>${plural(u.posts,['публикация','публикации','публикаций'])}</span></div><div><b>${num(u.followers)}</b><span>${plural(u.followers,['подписчик','подписчика','подписчиков'])}</span></div><div><b>${num(u.following)}</b><span>подписки</span></div></div></div>
      <div><div class="pname">${esc(u.name)}${u.official?'<span class="offl">официальный канал</span>':''}</div>${badgesHTML(u.badges)}${u.bio?`<p class="pbio">${rich(u.bio)}</p>`:''}</div>`;

    body+=`<div class="btns"><button class="btn" data-act="sub" data-sub="settings">Редактировать</button><button class="btn" data-act="sub" data-sub="support">Поддержка${ME.supportUnread?`<span class="n">${ME.supportUnread}</span>`:''}</button></div>`;
    if(ME.role==='admin'){const n=(ME.adminOpen||0)+(ME.adminReports||0);body+=`<div class="btns"><button class="btn pri" data-act="sub" data-sub="admin">Админ-панель${n?`<span class="n">${n}</span>`:''}</button></div>`;}

    if(!u.verified)body+=`<div class="card"><h3>${VB} Синяя галочка</h3><p>Галочка показывает, что аккаунт настоящий. Заявку рассматривает команда Кадра, ответ придёт в поддержку.</p><button class="btn pri" data-act="askverify">Подать заявку</button></div>`;
  }else body+=`<div class="btns"><button class="btn${u.isFollowing?'':' pri'}" data-act="follow" data-h="${esc(u.handle)}">${u.isFollowing?'Вы подписаны':'Подписаться'}</button></div>`;
  const reels=d.posts.filter(p=>p.type==='reel'),grid=d.posts.filter(p=>p.type!=='reel');
  const tabs=[['grid',I.grid,'Публикации'],['reels',I.reels,'Рилсы']].concat(me?[['saved',I.save,'Сохранённое']]:[]);

const RV={muted:true,active:null,paused:{},raf:0,io:null,jump:null};
function startReels(){
  const box=$('#reels');if(!box)return;
  RV.io?.disconnect();
  RV.io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting&&e.intersectionRatio>.6)setActive(e.target.dataset.rid);},{root:box,threshold:[.6]});
  box.querySelectorAll('.reel').forEach(el=>RV.io.observe(el));
  if(RV.jump){const el=box.querySelector(`[data-rid="${RV.jump}"]`);if(el)box.scrollTop=el.offsetTop;RV.jump=null;}
  const loop=()=>{const b=$('#reels');if(!b)return;const el=RV.active&&b.querySelector(`[data-rid="${RV.active}"]`);
    if(el){const v=el.querySelector('video');if(v&&v.duration)el.querySelector('.rprog b').style.width=(v.currentTime/v.duration*100)+'%';}
    RV.raf=requestAnimationFrame(loop);};
  cancelAnimationFrame(RV.raf);RV.raf=requestAnimationFrame(loop);
}
function setActive(id){
  if(RV.active===id)return;RV.active=id;
  document.querySelectorAll('#reels video').forEach(v=>{v.muted=RV.muted;if(v.closest('.reel').dataset.rid===id&&!RV.paused[id])v.play().catch(()=>{});else v.pause();});
}
function stopReels(){cancelAnimationFrame(RV.raf);RV.io?.disconnect();RV.active=null;document.querySelectorAll('#reels video').forEach(v=>v.pause());}
let tapT=null,lastTap={id:null,t:0};
function burst(el){const b=el.querySelector('.burst');if(!b)return;b.classList.remove('on');void b.offsetWidth;b.classList.add('on');}

function updatePost(p){
  posts[p.id]=p;
  document.querySelectorAll(`.post[data-id="${p.id}"]`).forEach(el=>{
    const tmp=document.createElement('div');tmp.innerHTML=postHTML(p);const n=tmp.firstElementChild;
    const old=el.querySelector('.photo,.textcard'),neu=n.querySelector('.photo,.textcard');if(old&&neu)neu.replaceWith(old);el.replaceWith(n);});
  const r=document.querySelector(`.reel[data-rid="${p.id}"]`);
  if(r){const lk=r.querySelector('.like');lk.setAttribute('aria-pressed',p.liked);lk.querySelector('span').textContent=num(p.likes);
    r.querySelector('[data-act="comments"] span').textContent=num(p.commentCount);r.querySelector('.save').setAttribute('aria-pressed',p.saved);}
}
async function like(id,on){
  const p=posts[id];if(!p)return;if(on===true&&p.liked)return;
  const prev={...p};const want=on??!p.liked;updatePost({...p,liked:want,likes:p.likes+(want?1:-1)});
  try{const d=await api('posts/'+id+'/like',{body:{on:want}});updatePost(d.post);}catch(e){updatePost(prev);toast(e.message);}
}

  if(!it.viewed){it.viewed=true;if(!g.mine)api('stories/'+it.id+'/view',{body:{}}).catch(()=>{});g.seen=g.items.every(x=>x.viewed);}
  SV.acc=0;SV.dur=5000;SV.last=performance.now();

  const tz=SV.el.querySelector('.tapz');
  tz.addEventListener('pointerdown',()=>{if(!SV)return;SV.down=performance.now();SV.paused=true;SV.el.querySelector('video')?.pause();});
  const up=()=>{if(!SV||!SV.down)return;SV.held=performance.now()-SV.down>250;SV.down=0;SV.paused=!!document.querySelector('.ov');if(!SV.paused)SV.el.querySelector('video')?.play().catch(()=>{});};
  ['pointerup','pointercancel','pointerleave'].forEach(t=>tz.addEventListener(t,up));
  cancelAnimationFrame(SV.raf);const bar=SV.el.querySelectorAll('.bars b')[SV.i];
  const tick=now=>{if(!SV)return;const dt=now-SV.last;SV.last=now;
    const vv=SV.el.querySelector('video');let k;
    if(vv&&vv.duration){k=vv.currentTime/vv.duration;if(vv.ended)k=1;}else{if(!SV.paused)SV.acc+=dt;k=SV.acc/SV.dur;}
    bar.style.width=Math.min(1,k)*100+'%';if(k>=1)return stepStory(1);SV.raf=requestAnimationFrame(tick);};

function stepStory(d){

function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
async function setPhotoDraft(file){
  const url=URL.createObjectURL(file);let img;try{img=await loadImage(url);}catch(e){toast('Не получилось открыть это изображение');return;}
  const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');const s=Math.max(c.width/img.width,c.height/img.height);
  x.drawImage(img,(c.width-img.width*s)/2,(c.height-img.height*s)/2,img.width*s,img.height*s);URL.revokeObjectURL(url);
  const t=document.createElement('canvas');t.width=t.height=140;t.getContext('2d').drawImage(c,0,135,1080,1080,0,0,140,140);
  S.draft={src:c.toDataURL('image/jpeg',.92),thumb:t.toDataURL('image/jpeg',.8),f:0,cap:S.draft?.cap||'',loc:S.draft?.loc||''};S.tab='new';S.user=null;S.sub=null;render();
}
const VIDEO_TYPES={'video/mp4':'video/mp4','video/webm':'video/webm','video/quicktime':'video/quicktime','video/x-m4v':'video/mp4'};
function loadFile(f){
  if(f.type.startsWith('video/')||/\.(mp4|mov|m4v|webm)$/i.test(f.name)){
    const type=VIDEO_TYPES[f.type]||(/\.webm$/i.test(f.name)?'video/webm':/\.mov$/i.test(f.name)?'video/quicktime':'video/mp4');
    if(f.size>80*1024*1024){toast('Видео больше 80 МБ. Выберите ролик покороче');return;}
    if(S.draft?.url)URL.revokeObjectURL(S.draft.url);S.draft={video:true,file:f,type,url:URL.createObjectURL(f),cap:S.draft?.cap||''};S.tab='new';render();return;}
  if(!f.type.startsWith('image/')){toast('Нужно фото (JPG, PNG, WebP) или видео (MP4, MOV, WebM)');return;}
  setPhotoDraft(f);
}

    case 'copylink':closeOv();copyText(location.origin+location.pathname+'?p='+a.dataset.id,'Ссылка на публикацию скопирована');break;
    case 'repact':{const row=a.closest('[data-pid]');const act2=a.dataset.a;
      if(act2!=='dismiss'&&!a.dataset.sure){a.dataset.sure='1';a.textContent='Точно? Нажмите ещё раз';break;}
      await api('admin/reports/'+row.dataset.pid,{body:{action:act2}});toast(act2==='dismiss'?'Жалобы отклонены':act2==='ban'?'Пост удалён, автор заблокирован':'Пост удалён');refreshMe();render(true);break;}
    case 'copyinvite':copyText(inviteURL(),'Ссылка-приглашение скопирована');break;
    case 'shareinvite':{const url=inviteURL(),text='Я в Кадре — соцсети для фото и рилсов. Присоединяйся!';
      if(navigator.share){try{await navigator.share({title:'Кадр',text,url});}catch(x){}}else copyText(text+' '+url,'Приглашение скопировано, отправьте его другу');break;}
    case 'tglink':{const d=await api('me/telegram',{body:{}});
      const w=window.Telegram?.WebApp;if(w&&w.openTelegramLink)w.openTelegramLink(d.url);else location.href=d.url;
      toast('Нажмите «Старт» в боте, потом вернитесь сюда');let n=0;const iv=setInterval(async()=>{n++;await refreshMe();if(ME.tg&&ME.tg.linked){clearInterval(iv);toast('Telegram подключён!');if(S.sub==='settings')render(true);}if(n>60)clearInterval(iv);},3000);break;}
    case 'tgunlink':{const d=await api('me/telegram',{method:'DELETE'});ME=d.me;toast('Telegram отключён');render(true);break;}
    case 'tgnotify':{const d=await api('me',{method:'PATCH',body:{tgNotify:a.checked}});ME=d.me;toast(a.checked?'Уведомления включены':'Уведомления выключены');break;}
    case 'hideios':iosHintHidden=true;try{localStorage.setItem('kadr-ios-hint','1');}catch(x){}$('#ioshint')?.remove();break;
    case 'pick':$('#file').click();break;
    case 'textpost':S.draft={text:true,cap:''};render();break;
    case 'filter':S.draft.f=+a.dataset.f;$('#pv').style.filter=FILTERS[S.draft.f][1];document.querySelectorAll('.flt').forEach(b=>b.setAttribute('aria-pressed',b===a));break;
    case 'discard':if(S.draft?.url)URL.revokeObjectURL(S.draft.url);S.draft=null;render();break;
    case 'avatar':$('#avfile').click();break;
    case 'noavatar':{const d=await api('me',{method:'PATCH',body:{avatar:null}});ME=d.me;render(true);break;}
    case 'logout':await api('logout',{body:{},auth:true});ME=null;S.auth='login';showAuth();break;
    case 'askverify':{const o=sheet('Заявка на галочку',`<form class="form" id="vf"><p style="margin:0;color:var(--muted);font-size:14px">Расскажите, кто вы и почему аккаунту нужна галочка. Ссылки на другие соцсети или сайт помогут.</p><textarea id="vt" rows="4" maxlength="2000" required placeholder="Например: я фотограф из Казани, мой сайт…"></textarea><p class="err" id="vf-err" hidden></p><button class="btn pri" style="min-height:44px">Отправить заявку</button></form>`);
      o.querySelector('#vf').addEventListener('submit',async ev=>{ev.preventDefault();try{const d=await api('support',{body:{kind:'verify',text:o.querySelector('#vt').value}});closeOv();S.sub='ticket';S.ticket=d.ticket.id;render();toast('Заявка отправлена');}catch(x){const er=o.querySelector('#vf-err');er.textContent=x.message;er.hidden=false;}});break;}
    case 'ticket':S.sub='ticket';S.ticket=a.dataset.id;render();break;
    case 'aticket':S.sub='aticket';S.ticket=a.dataset.id;render();break;
    case 'atab':S.adminTab=a.dataset.t;render();break;
    case 'tstatus':S.tstatus=a.dataset.s;render(true);break;
    case 'tverify':await api('admin/tickets/'+S.ticket+'/verify',{body:{grant:a.dataset.g==='1'}});toast(a.dataset.g==='1'?'Галочка выдана, пользователю отправлен ответ':'Заявка отклонена');render(true);break;
    case 'tclose':await api('admin/tickets/'+S.ticket+'/status',{body:{status:'closed'}});toast('Обращение закрыто');render(true);break;
    case 'treopen':await api('admin/tickets/'+S.ticket+'/status',{body:{status:'open'}});render(true);break;
    case 'averify':case 'arole':case 'aban':{const uid=a.closest('[data-uid]').dataset.uid;const key={averify:'verified',arole:'role',aban:'banned'}[act];const v=act==='arole'?a.dataset.v:a.dataset.v==='1';
      await api('admin/users/'+uid,{body:{[key]:v}});toast('Сохранено');render(true);break;}
    case 'areset':{const row=a.closest('[data-uid]');const d=await api('admin/users/'+row.dataset.uid+'/reset',{body:{}});
      sheet('Новый пароль',`<p style="margin:0">Передайте пользователю этот временный пароль. Старый больше не работает, все его устройства вышли из аккаунта.</p><div class="secret">${esc(d.password)}</div><button class="btn pri" style="min-height:44px" data-act="copysecret">Скопировать</button>`);break;}
    case 'copysecret':{const t=$('.secret').textContent;try{await navigator.clipboard.writeText(t);toast('Скопировано');}catch(x){const r=document.createRange();r.selectNodeContents($('.secret'));getSelection().removeAllRanges();getSelection().addRange(r);toast('Выделено, скопируйте вручную');}break;}
    case 'theme':{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('kadr-theme',r.dataset.theme);}catch(x){}break;}
  }}catch(x){toast(x.message);}
});
document.addEventListener('keydown',e=>{
  if(SV&&!document.querySelector('.ov')){if(e.key==='Escape')closeStory();if(e.key==='ArrowRight')stepStory(1);if(e.key==='ArrowLeft')stepStory(-1);return;}
  if(e.key==='Escape')closeOv();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('a[data-act]')){e.preventDefault();e.target.click();}
});
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(f)loadFile(f);e.target.value='';});
$('#sfile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)addStory(f);});
$('#avfile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const url=URL.createObjectURL(f);const img=await loadImage(url);URL.revokeObjectURL(url);const c=document.createElement('canvas');c.width=c.height=320;const s=Math.max(320/img.width,320/img.height);
    c.getContext('2d').drawImage(img,(320-img.width*s)/2,(320-img.height*s)/2,img.width*s,img.height*s);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.88));
    const up=await upload(blob,'image/jpeg');const d=await api('me',{method:'PATCH',body:{avatar:up.url}});ME=d.me;toast('Фото профиля обновлено');render(true);}
  catch(x){toast(x.message||'Не получилось загрузить фото');}});

/* ---------- live badges ---------- */
async function refreshMe(){try{const d=await api('me');const k=m=>(m.supportUnread||0)+'/'+(m.adminOpen||0)+'/'+(m.adminReports||0)+'/'+(m.activityUnread||0);const before=k(ME);ME=d.me;if(before!==k(ME)){tabsHTML();if(ME.supportUnread&&!S.sub)toast('Поддержка ответила на ваше обращение');}}catch(e){}}
setInterval(()=>{if(!ME||document.hidden)return;refreshMe();if(S.sub==='ticket'||S.sub==='aticket'){const ta=$('#r-text');if(!ta||!ta.value)render(true).then(()=>{if($('#chat'))scrollChat();});}},15000);

/* ---------- Android app back button ---------- */
window.kadrBack=()=>{
  if(SV&&!document.querySelector('.ov')){closeStory();return true;}
  if(document.querySelector('.ov')){closeOv();return true;}
  if(S.sub==='ticket'){S.sub='support';render();return true;}
  if(S.sub==='aticket'){S.sub='admin';render();return true;}
  if(S.sub){S.sub=null;S.tab='me';render();return true;}
  if(S.user){S.user=null;render();return true;}
  if(ME&&S.tab!=='feed'){S.tab='feed';S.draft=null;render();return true;}
  return false;
};

/* ---------- boot ---------- */
try{const t=localStorage.getItem('kadr-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
function applyDeepLink(){
  const q=DEEP;DEEP=null;if(!q)return false;
  if(q.get('support')){S.sub=q.get('support').startsWith('t')?'ticket':'support';S.ticket=q.get('support');return true;}
  if(q.get('admin')&&ME.role==='admin'){S.sub='admin';S.adminTab=q.get('admin')==='reports'?'reports':'tickets';S.tstatus='open';return true;}
  if(q.get('u')){const h=q.get('u');if(h===ME.handle){S.tab='me';}else S.user=h;return true;}
  if(q.get('p')){const id=q.get('p'),c=q.get('c');setTimeout(()=>c?openComments(id):openPost(id),300);return false;}
  return false;
}
window.addEventListener('load',()=>{try{const w=window.Telegram?.WebApp;if(w&&w.initData!==undefined){w.ready();w.expand();}}catch(e){}});
(async()=>{try{const d=await api('me',{auth:true});ME=d.me;applyDeepLink();render();}catch(e){if(/Нет связи/.test(e.message))$('#app').innerHTML=errBox(e.message);else{if(REF)S.auth='register';showAuth();}}})();
})();
</script>
</body>
</html>
