<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@500;700;800&display=swap">
<style>html,body{margin:0;background:#000}canvas{display:block;width:540px;height:960px}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,c=document.getElementById('c'),x=c.getContext('2d');
const ACC='#3246E6',ACC2='#6E7DFF',GOLD='#F0A33A',HEART='#E5334B',BG='#0B0D14',FG='#EDEFF7',MUT='#8C93AD';
const D="'Unbounded', sans-serif",B="'Manrope', sans-serif";
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const pr=(t,a,b)=>cl((t-a)/(b-a));
const eo=k=>1-Math.pow(1-k,3);
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eb=k=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;

/* procedural photos (same look as the app demo) */
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{const A=hex(a),Bc=hex(b);return'#'+A.map((v,i)=>Math.round(v+(Bc[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const PAL={dusk:['#2B1E4F','#C2477A','#FFB27A','#FFE3A8'],night:['#070A1C','#1C2350','#F9C74F','#FF8F5E'],taiga:['#DCE7E3','#7FA79B','#2E5246','#14271F'],frost:['#E9F1FF','#A8C3F0','#4E6BB3','#1D2A55'],bloom:['#FFE1E8','#FF7AA2','#6A5BFF','#FFC857'],sea:['#0E3A5C','#3C8DB5','#F3C6A0','#FFF0D6']};
function scene(seed,kind,pal,w,h){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d');const r=rng(seed);const P=PAL[pal];
  const sky=g.createLinearGradient(0,0,0,h);if(kind==='city'){sky.addColorStop(0,P[0]);sky.addColorStop(1,P[1]);}else{sky.addColorStop(0,P[0]);sky.addColorStop(.55,P[1]);sky.addColorStop(1,P[2]);}
  g.fillStyle=sky;g.fillRect(0,0,w,h);const hz=h*(.52+r()*.1);
  const sun=(cx,cy,rad,col)=>{const q=g.createRadialGradient(cx,cy,0,cx,cy,rad*3);q.addColorStop(0,col);q.addColorStop(.3,col+'88');q.addColorStop(1,col+'00');g.fillStyle=q;g.fillRect(0,0,w,h);g.fillStyle=col;g.beginPath();g.arc(cx,cy,rad,0,7);g.fill();};
  if(kind==='mountains'||kind==='taiga'){sun(w*.6,hz-h*.12,w*.07,P[3]);
    for(let L=0;L<5;L++){const y0=hz-h*.18+L*h*.1;g.fillStyle=mix(P[1],P[0],.25+L*.17);g.beginPath();g.moveTo(0,h);for(let px=0;px<=w;px+=w/(8+L*3))g.lineTo(px,y0-r()*h*(.16-L*.02));g.lineTo(w,h);g.fill();
      if(kind==='taiga'&&L>1){g.fillStyle=mix(P[3],P[0],.15*(4-L));for(let t=0;t<14+L*4;t++){const tx=r()*w,ty=y0+r()*h*.06,th=(40+L*24+r()*30)*w/720;g.beginPath();g.moveTo(tx,ty-th);g.lineTo(tx-th*.28,ty);g.lineTo(tx+th*.28,ty);g.fill();}}}}
  else if(kind==='sea'){const sx=w*.5;sun(sx,hz-h*.06,w*.065,P[3]);const q=g.createLinearGradient(0,hz,0,h);q.addColorStop(0,mix(P[1],P[0],.3));q.addColorStop(1,P[0]);g.fillStyle=q;g.fillRect(0,hz,w,h-hz);
    for(let i=0;i<80;i++){const y=hz+Math.pow(r(),1.6)*(h-hz),ww=(10+r()*120*(y-hz)/(h-hz)+10)*w/720;g.fillStyle=P[3]+(r()>.5?'cc':'66');g.fillRect(sx-ww/2+(r()-.5)*90*(y-hz)/(h-hz),y,ww,3);}}
  else if(kind==='city'){for(let i=0;i<160;i++){g.fillStyle='rgba(255,255,255,'+(r()*.8)+')';g.fillRect(r()*w,r()*hz*.8,2,2);}sun(w*.7,h*.16,w*.04,'#F4F1E6');
    for(let L=0;L<3;L++){let px=-20;while(px<w){const bw=(40+r()*90)*w/720,bh=h*(.18+r()*.38)-L*40,top=h-bh;g.fillStyle=mix(P[0],P[1],.15+L*.25);g.fillRect(px,top,bw,bh);px+=bw+2;}}}
  else{g.globalCompositeOperation='multiply';for(let i=0;i<9;i++){const cx=r()*w,cy=r()*h,rad=(80+r()*220)*w/720;const q=g.createRadialGradient(cx,cy,0,cx,cy,rad);const col=P[1+Math.floor(r()*3)];q.addColorStop(0,col);q.addColorStop(1,col+'00');g.fillStyle=q;g.beginPath();g.arc(cx,cy,rad,0,7);g.fill();}g.globalCompositeOperation='source-over';}
  const v=g.createRadialGradient(w/2,h/2,h*.3,w/2,h/2,h*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.28)');g.fillStyle=v;g.fillRect(0,0,w,h);
  return cv;
}
const IMG={};
function prep(){
  IMG.sea=scene(11,'sea','dusk',600,750);
  IMG.city=scene(22,'city','night',600,750);
  IMG.bloom=scene(44,'bloom','bloom',600,750);
  IMG.reel1=scene(901,'city','night',600,1240);
  IMG.reel2=scene(902,'taiga','frost',600,1240);
  IMG.mtn=scene(77,'mountains','dusk',600,750);
}

/* drawing helpers */
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r);}
function text(s,X,Y,size,font,col,align='center',weight=700,alpha=1,ls=0){x.save();x.globalAlpha*=alpha;x.fillStyle=col;x.font=`${weight} ${size}px ${font}`;x.textAlign=align;x.textBaseline='alphabetic';if(ls)x.letterSpacing=ls+'px';x.fillText(s,X,Y);x.restore();}
function logoMark(cx,cy,s,rot=0){
  x.save();x.translate(cx,cy);x.rotate(rot);
  const g=x.createConicGradient(3.5,0,0);g.addColorStop(0,ACC);g.addColorStop(.35,GOLD);g.addColorStop(.7,HEART);g.addColorStop(1,ACC);
  x.fillStyle=g;rr(-s/2,-s/2,s,s,s*.3);x.fill();
  x.fillStyle=BG;x.beginPath();x.arc(0,0,s*.22,0,7);x.fill();x.restore();
}
function vbadge(cx,cy,r,fill=ACC,stroke='#fff'){
  x.save();x.translate(cx,cy);x.beginPath();for(let i=0;i<32;i++){const a=Math.PI*2*i/32-Math.PI/2,q=i%2?r*.85:r;i?x.lineTo(q*Math.cos(a),q*Math.sin(a)):x.moveTo(q*Math.cos(a),q*Math.sin(a));}
  x.closePath();x.fillStyle=fill;x.fill();x.strokeStyle=stroke;x.lineWidth=r*.2;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(-r*.37,r*.03);x.lineTo(-r*.12,r*.27);x.lineTo(r*.37,-r*.23);x.stroke();x.restore();
}
function heartPath(cx,cy,s){x.beginPath();x.moveTo(cx,cy+s*.35);x.bezierCurveTo(cx-s*.9,cy-s*.15,cx-s*.45,cy-s*.75,cx,cy-s*.3);x.bezierCurveTo(cx+s*.45,cy-s*.75,cx+s*.9,cy-s*.15,cx,cy+s*.35);x.closePath();}
function bg(t){
  x.fillStyle=BG;x.fillRect(0,0,W,H);
  const blobs=[[ACC,.25,.2,700,0],[HEART,.8,.45,600,2],[GOLD,.3,.85,560,4],[ACC2,.75,.95,500,1]];
  for(const [col,bx,by,rad,ph] of blobs){const cx=W*(bx+.08*Math.sin(t*.6+ph)),cy=H*(by+.05*Math.cos(t*.5+ph));const g=x.createRadialGradient(cx,cy,0,cx,cy,rad);g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');x.fillStyle=g;x.fillRect(0,0,W,H);}
  // grain-ish dots
  x.fillStyle='rgba(255,255,255,.035)';const r=rng(Math.floor(t*12));for(let i=0;i<300;i++)x.fillRect(r()*W,r()*H,2,2);
}

/* phone */
const PW=620,PH=1260;
function phone(cx,top,scale,alpha,drawScreen){
  x.save();x.globalAlpha=alpha;x.translate(cx,top);x.scale(scale,scale);
  x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=80;x.shadowOffsetY=30;
  x.fillStyle='#1A1D2B';rr(-PW/2-14,-14,PW+28,PH+28,86);x.fill();x.shadowColor='transparent';
  x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=3;rr(-PW/2-14,-14,PW+28,PH+28,86);x.stroke();
  x.save();rr(-PW/2,0,PW,PH,72);x.clip();x.translate(-PW/2,0);drawScreen();x.restore();
  x.fillStyle='#000';rr(-70,18,140,36,18);x.fill();
  x.restore();
}
function appTop(y,title){x.fillStyle='#131623';x.fillRect(0,y,PW,110);
  if(title==='logo'){logoMarkSmall(46,y+70);text('кадр',74,y+82,36,D,FG,'left',700);}else text(title,PW/2,y+82,32,D,FG,'center',500);}
function logoMarkSmall(cx,cy){const s=34;const g=x.createConicGradient(3.5,cx,cy);g.addColorStop(0,ACC);g.addColorStop(.35,GOLD);g.addColorStop(.7,HEART);g.addColorStop(1,ACC);x.fillStyle=g;rr(cx-s/2,cy-s/2-8,s,s,10);x.fill();x.fillStyle='#131623';x.beginPath();x.arc(cx,cy-8,7.5,0,7);x.fill();}
function tabbar(){x.fillStyle='#131623';x.fillRect(0,PH-110,PW,110);x.fillStyle='rgba(255,255,255,.08)';x.fillRect(0,PH-110,PW,2);
  const xs=[70,190,310,430,550];xs.forEach((X,i)=>{if(i===2){x.fillStyle=ACC;rr(X-34,PH-80,68,50,16);x.fill();x.strokeStyle='#fff';x.lineWidth=5;x.lineCap='round';x.beginPath();x.moveTo(X,PH-68);x.lineTo(X,PH-42);x.moveTo(X-13,PH-55);x.lineTo(X+13,PH-55);x.stroke();}
    else{x.strokeStyle=i===0?FG:MUT;x.lineWidth=4;rr(X-16,PH-72,32,32,8);x.stroke();}});}
function postCard(y,img,handle,verified,likes,liked,burstK,av){
  // header
  x.fillStyle=av;x.beginPath();x.arc(54,y+34,26,0,7);x.fill();text(handle[0].toUpperCase(),54,y+45,28,D,'#fff');
  text(handle,94,y+44,26,B,FG,'left',800);
  if(verified){x.font=`800 26px ${B}`;const w=x.measureText(handle).width;vbadge(94+w+18,y+35,12);}
  // photo
  x.save();rr(24,y+76,PW-48,(PW-48)*1.25,28);x.clip();x.drawImage(img,24,y+76,PW-48,(PW-48)*1.25);
  if(burstK>0&&burstK<1){const s=burstK<.25?lerp(.3,1.15,burstK/.25):burstK<.45?lerp(1.15,.95,(burstK-.25)/.2):1;const a=burstK<.7?1:1-(burstK-.7)/.3;
    x.globalAlpha=a;x.fillStyle='#fff';x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=30;heartPath(PW/2,y+76+(PW-48)*.66,150*s);x.fill();}
  x.restore();
  const ay=y+76+(PW-48)*1.25+48;
  heartPath(48,ay,46);if(liked){x.fillStyle=HEART;x.fill();}else{x.strokeStyle=FG;x.lineWidth=4;x.stroke();}
  x.strokeStyle=FG;x.lineWidth=4;x.beginPath();x.arc(118,ay-4,19,0,7);x.stroke();
  text(likes.toLocaleString('ru-RU')+' отметок «Нравится»',28,ay+62,24,B,FG,'left',800);
}

/* scenes */
function draw(t){
  bg(t);
  // ---------- S1 logo 0-2.4
  if(t<2.6){
    const out=eio(pr(t,2.05,2.45));
    x.save();x.globalAlpha=1-out;x.translate(0,-160*out);
    const k=eb(pr(t,.1,.75));logoMark(W/2,720,240*k,(1-pr(t,.1,.9))*-1.2);
    const word='кадр';x.font=`800 190px ${D}`;let total=x.measureText(word).width;let sx=W/2-total/2;
    for(let i=0;i<word.length;i++){const ch=word[i];const kk=eo(pr(t,.45+i*.09,.85+i*.09));const w=x.measureText(ch).width;
      text(ch,sx+w/2,1080+60*(1-kk),190,D,FG,'center',800,kk);sx+=w;}
    text('соцсеть для фото и рилсов',W/2,1200,52,B,MUT,'center',700,eo(pr(t,1.05,1.5)));
    x.restore();
  }
  // ---------- S2 feed 2.4-6.0  + S3 reels 6.0-9.6 (phone visible 2.4-9.9)
  if(t>=2.3&&t<10.1){
    const inK=eo(pr(t,2.35,3.05)),outK=eio(pr(t,9.55,10.05));
    const top=lerp(H+40,560,inK)+lerp(0,-1500,outK);
    const sc=lerp(1,.8,outK);
    phone(W/2,top,sc,1,()=>{
      x.fillStyle='#131623';x.fillRect(0,0,PW,PH);
      if(t<6.05){
        const scroll=eio(pr(t,4.9,5.8))*820;
        x.save();x.translate(0,-scroll);
        const liked=t>4.25,bk=pr(t,4.15,4.95);
        postCard(120,IMG.sea,'lena.orlova',true,2481+(liked?1:0),liked,bk,'#C2477A');
        postCard(120+900,IMG.city,'sasha.noch',true,5302,false,0,'#1C2350');
        x.restore();
        appTop(0,'logo');tabbar();
        // finger tap circles
        for(const tt of [4.0,4.15]){const k=pr(t,tt,tt+.35);if(k>0&&k<1){x.strokeStyle=`rgba(255,255,255,${.7*(1-k)})`;x.lineWidth=6;x.beginPath();x.arc(PW/2,120+76+(PW-48)*.66,30+60*k,0,7);x.stroke();}}
      }else{
        // reels
        const sw=eio(pr(t,7.75,8.3));
        const drawReel=(img,yy,lt,kind)=>{x.save();x.translate(0,yy);x.save();rr(0,0,PW,PH,0);x.clip();
          const z=1.06+.04*Math.sin(lt);x.drawImage(img,(PW-PW*z)/2,(PH-PH*z)/2,PW*z,PH*z);
          const r=rng(kind==='city'?5:9);
          if(kind==='city'){for(let i=0;i<70;i++){const px=r()*PW,py=PH*.55+r()*PH*.42,ph=r()*6,v=.5+r();if(Math.sin(lt*4*v+ph*3)>.4){x.fillStyle=r()>.5?'#F9C74F':'#FF8F5E';x.fillRect(px,py,9,12);}else r();}}
          else{x.fillStyle='#fff';for(let i=0;i<90;i++){const px=r()*PW,py=(r()*PH+lt*90*(.5+r()))%PH,s=1.5+r()*4;x.globalAlpha=.5+r()*.5;x.beginPath();x.arc(px+Math.sin(lt+i)*10,py,s,0,7);x.fill();}x.globalAlpha=1;}
          const gr=x.createLinearGradient(0,PH*.55,0,PH);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.7)');x.fillStyle=gr;x.fillRect(0,0,PW,PH);x.restore();
          // side icons
          const by=PH-520;[['heart',kind==='city'?'18,4К':'9 310'],['chat','214'],['send','']].forEach(([ic,n],i)=>{const iy=by+i*120;
            if(ic==='heart'){heartPath(PW-60,iy,50);if(kind==='city'&&t>7.1){x.fillStyle='#FF4D63';x.fill();}else{x.strokeStyle='#fff';x.lineWidth=4;x.stroke();}}
            else if(ic==='chat'){x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();x.arc(PW-60,iy-4,20,0,7);x.stroke();}
            else{x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();x.moveTo(PW-80,iy-4);x.lineTo(PW-40,iy-22);x.lineTo(PW-56,iy+18);x.closePath();x.stroke();}
            if(n)text(n,PW-60,iy+50,22,B,'#fff','center',800);});
          const h=kind==='city'?'sasha.noch':'tim.taiga';
          x.fillStyle=kind==='city'?'#1C2350':'#2E5246';x.beginPath();x.arc(52,PH-230,28,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke();text(h[0].toUpperCase(),52,PH-219,26,D,'#fff');
          text(h,94,PH-220,26,B,'#fff','left',800);x.font=`800 26px ${B}`;vbadge(94+x.measureText(h).width+18,PH-229,12,'#fff',ACC);
          text(kind==='city'?'Город не спит. #ночь #город':'Первый снег в Карелии #лес',30,PH-170,24,B,'#fff','left',600);
          x.fillStyle='rgba(255,255,255,.25)';x.fillRect(0,PH-112,PW,4);x.fillStyle='#fff';x.fillRect(0,PH-112,PW*((lt*.18)%1),4);
          x.restore();};
        drawReel(IMG.reel1,-PH*sw,t*1.0,'city');
        if(sw>0)drawReel(IMG.reel2,PH*(1-sw),t*1.0,'taiga');
        text('Рилсы',30,96,36,D,'#fff','left',700);
        tabbar();
        // double tap at 7.0
        const bk=pr(t,7.0,7.7);if(bk>0&&bk<1){const s=bk<.25?lerp(.3,1.15,bk/.25):bk<.45?lerp(1.15,.95,(bk-.25)/.2):1;x.save();x.globalAlpha=bk<.7?1:1-(bk-.7)/.3;x.fillStyle='#fff';heartPath(PW/2,PH*.48,170*s);x.fill();x.restore();}
        // swipe hint finger
        const fk=pr(t,7.55,8.25);if(fk>0&&fk<1){x.fillStyle=`rgba(255,255,255,${.55*Math.sin(fk*Math.PI)})`;x.beginPath();x.arc(PW/2,lerp(PH*.75,PH*.3,eio(fk)),34,0,7);x.fill();}
      }
    });
    // headlines above phone
    const head=(s,a,b,col)=>{const k=eo(pr(t,a,a+.5)),o=eio(pr(t,b-.35,b));if(k<=0||o>=1)return;text(s,W/2,330+40*(1-k)-30*o,92,D,col||FG,'center',800,k*(1-o));};
    head('Делись кадрами',2.6,6.0);
    head('Снимай рилсы',6.15,9.6);
    const sub=(s,a,b)=>{const k=eo(pr(t,a,a+.5)),o=eio(pr(t,b-.35,b));if(k<=0||o>=1)return;text(s,W/2,430+30*(1-k)-30*o,44,B,MUT,'center',700,k*(1-o));};
    sub('лайки, комментарии, подписки',2.85,6.0);
    sub('вертикальные видео в ленте',6.35,9.6);
  }
  // ---------- S4 verified + support 9.6-12.2
  if(t>=9.7&&t<12.4){
    const out=eio(pr(t,11.95,12.35));x.save();x.globalAlpha=1-out;x.translate(0,-120*out);
    const k=eb(pr(t,9.8,10.4));
    // rays
    x.save();x.translate(W/2,600);x.rotate(t*.4);for(let i=0;i<12;i++){x.rotate(Math.PI/6);const g=x.createLinearGradient(0,0,0,-420);g.addColorStop(0,ACC2+'66');g.addColorStop(1,ACC2+'00');x.fillStyle=g;x.globalAlpha=(1-out)*pr(t,9.9,10.4);x.beginPath();x.moveTo(-26,0);x.lineTo(26,0);x.lineTo(0,-420*k);x.fill();}x.restore();
    vbadge(W/2,600,170*k,ACC2,'#fff');
    text('Синяя галочка',W/2,940,92,D,FG,'center',800,eo(pr(t,10.0,10.5)));
    text('для настоящих авторов',W/2,1020,46,B,MUT,'center',700,eo(pr(t,10.15,10.65)));
    // chat
    const bub=(s,a,mine,y)=>{const kk=eo(pr(t,a,a+.4));if(kk<=0)return;x.save();x.globalAlpha*=kk;x.font=`700 40px ${B}`;const w=x.measureText(s).width+64,hgt=96;
      const X=mine?W-120-w+40*(1-kk):120-40*(1-kk);x.fillStyle=mine?ACC:'#1E2233';rr(X,y,w,hgt,40);x.fill();text(s,X+32,y+62,40,B,'#fff','left',700);
      if(!mine){x.font=`800 26px ${B}`;text('Поддержка Кадра',X+6,y-14,26,B,ACC2,'left',800);}x.restore();};
    text('Поддержка прямо в чате',W/2,1210,40,D,FG,'center',500,eo(pr(t,10.5,10.9)));
    bub('Как получить галочку?',10.75,true,1290);
    bub('Подайте заявку в профиле!',11.25,false,1460);
    x.restore();
  }
  // ---------- S5 CTA 12.2-15
  if(t>=12.2){
    const k=eb(pr(t,12.25,12.85));logoMark(W/2,560,200*k,0);
    text('кадр',W/2,860,170,D,FG,'center',800,eo(pr(t,12.45,12.95)));
    text('Регистрируйся бесплатно',W/2,1000,56,B,FG,'center',800,eo(pr(t,12.7,13.2)));
    // url pill
    const pk=eo(pr(t,13.0,13.5));x.save();x.globalAlpha=pk;x.translate(0,30*(1-pk));
    x.font=`800 56px ${B}`;const url='getkadr.space';const uw=x.measureText(url).width+90;
    const pulse=1+.03*Math.sin(t*6)*pr(t,13.6,14);x.save();x.translate(W/2,1150);x.scale(pulse,pulse);
