name: Тихий час — сборка APK
on:
  push:
    paths: ['tihiy-chas-android/**', '.github/workflows/tihiy-chas-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tihiy-chas-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tihiy-chas-debug-apk
          path: tihiy-chas-android/app/build/outputs/apk/debug/*.apk
