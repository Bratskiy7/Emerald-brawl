name: Kadr APK

on:
  push:
    branches: [kadr]
    paths: ['android/**', '.github/workflows/kadr-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk kadr.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kadr-v1.${{ github.run_number }}
          name: Кадр 1.${{ github.run_number }}
          body: |
            Приложение «Кадр» для Android 8 и новее.
            Скачайте kadr.apk ниже и откройте его на телефоне.
          files: kadr.apk
          target_commitish: ${{ github.sha }}
          make_latest: true
