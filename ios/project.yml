name: Kadr
options:
  bundleIdPrefix: ru.kadr
  deploymentTarget:
    iOS: "15.0"
targets:
  Kadr:
    type: application
    platform: iOS
    sources: [Kadr]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kadr.app
        PRODUCT_NAME: Kadr
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Кадр
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_NSCameraUsageDescription: Кадру нужна камера, чтобы снимать фото и видео для публикаций.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Кадру нужен доступ к фото, чтобы вы могли выбрать снимок или видео для публикации.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Кадру нужен микрофон, чтобы записывать звук в видео.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
